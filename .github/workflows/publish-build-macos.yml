name: Publish Build — macOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_id:
        required: true
        type: string
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: version
        run: |
          VERSION=$(node -p "require('./product.json').loopholeVersion ?? require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS x64
  # Produces: Loophole-darwin-x64-{version}.dmg
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-x64:
    name: Build macOS x64 (Intel)
    needs: resolve-version
    runs-on: macos-14
    environment: publish
    env:
      VERSION: ${{ inputs.version || needs.resolve-version.outputs.version }}
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: publish-macos-x64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: publish-macos-x64-cargo-

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: publish-macos-x64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: publish-macos-x64-electron-

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile build
        run: npm run gulp compile-build-without-mangling
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Bundle VSCode
        run: npm run gulp bundle-vscode
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Verify out-vscode exists
        run: |
          [ -d "out-vscode" ] || { echo "::error::out-vscode/ not found"; exit 1; }

      - name: Build CLI (x64)
        working-directory: cli
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package Electron app (darwin x64)
        run: npm run gulp vscode-darwin-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Ad-hoc codesign .app
        run: |
          APP_PATH=$(find .. -maxdepth 2 -name "*.app" -type d 2>/dev/null | grep -i "darwin-x64" | head -1)
          [ -z "$APP_PATH" ] && APP_PATH="../VSCode-darwin-x64/loophole.app"
          [ -d "$APP_PATH" ] && codesign --deep --force --sign - "$APP_PATH" || echo "::warning::codesign skipped"

      - name: Build DMG
        run: |
          set -e
          APP_PATH=$(find .. -maxdepth 2 -name "*.app" -type d 2>/dev/null | grep -i "darwin-x64" | head -1)
          [ -z "$APP_PATH" ] && APP_PATH="../VSCode-darwin-x64/Visual Studio Code.app"
          [ -d "$APP_PATH" ] || { echo "::error::No .app found"; exit 1; }
          hdiutil create -volname "Loophole" -srcfolder "$APP_PATH" -ov -format UDZO \
            "dist/Loophole-darwin-x64-$VERSION.dmg"

      - name: Compute SHA256
        run: |
          echo "{}" > sha256-hashes.json
          for f in dist/*; do
            [ -f "$f" ] || continue
            FILENAME=$(basename "$f")
            SHA=$(shasum -a 256 "$f" | awk '{print $1}')
            python3 -c "import json,sys; d=json.load(open('sha256-hashes.json')); d[sys.argv[1]]=sys.argv[2]; json.dump(d,open('sha256-hashes.json','w'),indent=2)" "$FILENAME" "$SHA"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sha256-hashes-macos-x64
          path: sha256-hashes.json
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Loophole-darwin-x64-${{ env.VERSION }}-dmg
          path: dist/Loophole-darwin-x64-${{ env.VERSION }}.dmg
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*; do
            [ -f "$f" ] && gh release upload "$VERSION" "$f" --clobber
          done

      - name: Upload to Gofile.io
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          [ -z "$SERVER" ] && { echo "[]" > gofile-links-x64.json; exit 0; }
          echo "[" > gofile-links-x64.json; FIRST=true
          for FILE in dist/*; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','N/A'))" 2>/dev/null)
            [ "$LINK" = "N/A" ] && continue
            [ "$FIRST" = true ] && FIRST=false || echo "," >> gofile-links-x64.json
            echo "  {\"filename\": \"$FILENAME\", \"link\": \"$LINK\", \"platform\": \"macos-x64\"}" >> gofile-links-x64.json
          done
          echo "]" >> gofile-links-x64.json

      - uses: actions/upload-artifact@v4
        with:
          name: gofile-links-macos-x64
          path: gofile-links-x64.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS arm64
  # Produces: Loophole-darwin-arm64-{version}.dmg
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-arm64:
    name: Build macOS ARM64 (Apple Silicon)
    needs: resolve-version
    runs-on: macos-14
    environment: publish
    env:
      VERSION: ${{ inputs.version || needs.resolve-version.outputs.version }}
      VSCODE_ARCH: arm64
      VSCODE_QUALITY: stable

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: publish-macos-arm64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: publish-macos-arm64-cargo-

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: publish-macos-arm64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: publish-macos-arm64-electron-

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: arm64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile build
        run: npm run gulp compile-build-without-mangling
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Bundle VSCode
        run: npm run gulp bundle-vscode
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Verify out-vscode exists
        run: |
          [ -d "out-vscode" ] || { echo "::error::out-vscode/ not found"; exit 1; }

      - name: Build CLI (arm64)
        working-directory: cli
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package Electron app (darwin arm64)
        run: npm run gulp vscode-darwin-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Ad-hoc codesign .app
        run: |
          APP_PATH=$(find .. -maxdepth 2 -name "*.app" -type d 2>/dev/null | grep -i "darwin-arm64" | head -1)
          [ -z "$APP_PATH" ] && APP_PATH="../VSCode-darwin-arm64/Visual Studio Code.app"
          [ -d "$APP_PATH" ] && codesign --deep --force --sign - "$APP_PATH" || echo "::warning::codesign skipped"

      - name: Build DMG
        run: |
          set -e
          APP_PATH=$(find .. -maxdepth 2 -name "*.app" -type d 2>/dev/null | grep -i "darwin-arm64" | head -1)
          [ -z "$APP_PATH" ] && APP_PATH="../VSCode-darwin-arm64/Visual Studio Code.app"
          [ -d "$APP_PATH" ] || { echo "::error::No .app found"; exit 1; }
          hdiutil create -volname "Loophole" -srcfolder "$APP_PATH" -ov -format UDZO \
            "dist/Loophole-darwin-arm64-$VERSION.dmg"

      - name: Compute SHA256
        run: |
          echo "{}" > sha256-hashes.json
          for f in dist/*; do
            [ -f "$f" ] || continue
            FILENAME=$(basename "$f")
            SHA=$(shasum -a 256 "$f" | awk '{print $1}')
            python3 -c "import json,sys; d=json.load(open('sha256-hashes.json')); d[sys.argv[1]]=sys.argv[2]; json.dump(d,open('sha256-hashes.json','w'),indent=2)" "$FILENAME" "$SHA"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sha256-hashes-macos-arm64
          path: sha256-hashes.json
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Loophole-darwin-arm64-${{ env.VERSION }}-dmg
          path: dist/Loophole-darwin-arm64-${{ env.VERSION }}.dmg
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*; do
            [ -f "$f" ] && gh release upload "$VERSION" "$f" --clobber
          done

      - name: Upload to Gofile.io
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          [ -z "$SERVER" ] && { echo "[]" > gofile-links-arm64.json; exit 0; }
          echo "[" > gofile-links-arm64.json; FIRST=true
          for FILE in dist/*; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','N/A'))" 2>/dev/null)
            [ "$LINK" = "N/A" ] && continue
            [ "$FIRST" = true ] && FIRST=false || echo "," >> gofile-links-arm64.json
            echo "  {\"filename\": \"$FILENAME\", \"link\": \"$LINK\", \"platform\": \"macos-arm64\"}" >> gofile-links-arm64.json
          done
          echo "]" >> gofile-links-arm64.json

      - uses: actions/upload-artifact@v4
        with:
          name: gofile-links-macos-arm64
          path: gofile-links-arm64.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS Universal
  # Merges x64 + arm64 DMGs → Loophole-darwin-universal-{version}.dmg
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-universal:
    name: Build macOS Universal
    needs: [resolve-version, build-macos-x64, build-macos-arm64]
    runs-on: macos-14
    environment: publish
    env:
      VERSION: ${{ inputs.version || needs.resolve-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download x64 DMG
        uses: actions/download-artifact@v4
        with:
          name: Loophole-darwin-x64-${{ env.VERSION }}-dmg
          path: downloads/x64

      - name: Download arm64 DMG
        uses: actions/download-artifact@v4
        with:
          name: Loophole-darwin-arm64-${{ env.VERSION }}-dmg
          path: downloads/arm64

      - name: Extract .app bundles from DMGs
        run: |
          set -e
          mkdir -p mount/x64 mount/arm64 apps/x64 apps/arm64
          hdiutil attach "downloads/x64/Loophole-darwin-x64-$VERSION.dmg" -mountpoint mount/x64 -readonly -nobrowse
          cp -R mount/x64/*.app apps/x64/
          hdiutil detach mount/x64
          hdiutil attach "downloads/arm64/Loophole-darwin-arm64-$VERSION.dmg" -mountpoint mount/arm64 -readonly -nobrowse
          cp -R mount/arm64/*.app apps/arm64/
          hdiutil detach mount/arm64

      - name: Create Universal .app with lipo
        run: |
          set -e
          X64_APP=$(find apps/x64 -name "*.app" -maxdepth 1 | head -1)
          ARM64_APP=$(find apps/arm64 -name "*.app" -maxdepth 1 | head -1)
          APP_NAME=$(basename "$X64_APP")
          UNIVERSAL_APP="apps/universal/$APP_NAME"
          mkdir -p apps/universal
          cp -R "$X64_APP" "$UNIVERSAL_APP"
          find "$X64_APP" -type f | while read -r X64_BIN; do
            REL="${X64_BIN#$X64_APP/}"
            ARM64_BIN="$ARM64_APP/$REL"
            UNIV_BIN="$UNIVERSAL_APP/$REL"
            if [ -f "$ARM64_BIN" ] && file "$X64_BIN" | grep -q "Mach-O"; then
              lipo -create "$X64_BIN" "$ARM64_BIN" -output "$UNIV_BIN" 2>/dev/null || cp "$ARM64_BIN" "$UNIV_BIN"
            fi
          done

      - name: Ad-hoc codesign universal .app
        run: |
          UNIVERSAL_APP=$(find apps/universal -name "*.app" -maxdepth 1 | head -1)
          codesign --deep --force --sign - "$UNIVERSAL_APP" || echo "::warning::codesign failed"

      - name: Build Universal DMG
        run: |
          set -e
          mkdir -p dist
          UNIVERSAL_APP=$(find apps/universal -name "*.app" -maxdepth 1 | head -1)
          hdiutil create -volname "Loophole" -srcfolder "$UNIVERSAL_APP" -ov -format UDZO \
            "dist/Loophole-darwin-universal-$VERSION.dmg"

      - name: Compute SHA256
        run: |
          echo "{}" > sha256-hashes.json
          for f in dist/*; do
            [ -f "$f" ] || continue
            FILENAME=$(basename "$f")
            SHA=$(shasum -a 256 "$f" | awk '{print $1}')
            python3 -c "import json,sys; d=json.load(open('sha256-hashes.json')); d[sys.argv[1]]=sys.argv[2]; json.dump(d,open('sha256-hashes.json','w'),indent=2)" "$FILENAME" "$SHA"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sha256-hashes-macos-universal
          path: sha256-hashes.json
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Loophole-darwin-universal-${{ env.VERSION }}-dmg
          path: dist/Loophole-darwin-universal-${{ env.VERSION }}.dmg
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*; do
            [ -f "$f" ] && gh release upload "$VERSION" "$f" --clobber
          done

      - name: Upload to Gofile.io
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          [ -z "$SERVER" ] && { echo "[]" > gofile-links-universal.json; exit 0; }
          echo "[" > gofile-links-universal.json; FIRST=true
          for FILE in dist/*; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','N/A'))" 2>/dev/null)
            [ "$LINK" = "N/A" ] && continue
            [ "$FIRST" = true ] && FIRST=false || echo "," >> gofile-links-universal.json
            echo "  {\"filename\": \"$FILENAME\", \"link\": \"$LINK\", \"platform\": \"macos-universal\"}" >> gofile-links-universal.json
          done
          echo "]" >> gofile-links-universal.json

      - uses: actions/upload-artifact@v4
        with:
          name: gofile-links-macos-universal
          path: gofile-links-universal.json
          retention-days: 7
