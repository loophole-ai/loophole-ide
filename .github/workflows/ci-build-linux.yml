name: CI Build — Linux

on:
  pull_request:
    branches:
      - code
  workflow_dispatch:
    inputs:
      upload_to_gofile:
        description: 'Upload artifacts to Gofile.io for faster download?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '24.18.0'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  pr-check:
    name: PR Compile Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev pkg-config

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Install dependencies
        run: npm install

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

  resolve-version:
    name: Resolve Version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./product.json').loopholeVersion ?? require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build-linux-x64:
    name: Build Linux x64
    needs: resolve-version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libx11-dev libxkbfile-dev libsecret-1-dev \
            libkrb5-dev fakeroot python3-pip \
            pkg-config libgtk-3-dev libnss3-dev libgbm-dev libasound2-dev \
            rpm

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: linux-x64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: linux-x64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: linux-x64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-x64-electron-

      - name: Install dependencies
        run: npm install
        env:
          npm_config_arch: x64

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile build (produces out-build/)
        run: npm run gulp compile-build-without-mangling
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, x64)
        working-directory: cli
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Bundle VSCode (produces out-vscode/)
        run: npm run gulp bundle-vscode
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Verify out-vscode exists
        run: |
          if [ ! -d "out-vscode" ]; then
            echo "::error::out-vscode/ not found"
            exit 1
          fi

      - name: Package Electron app (linux x64)
        run: npm run gulp vscode-linux-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build .deb (x64)
        run: |
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build .rpm (x64)
        run: |
          npm run gulp vscode-linux-x64-prepare-rpm
          npm run gulp vscode-linux-x64-build-rpm
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find .build/linux/deb -name "*.deb" -exec cp {} dist/ \;
          find .build/linux/rpm -name "*.rpm" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload — deb x64
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-${{ env.VERSION }}-amd64-deb
          path: dist/*.deb
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — rpm x64
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-${{ env.VERSION }}-x86_64-rpm
          path: dist/*.rpm
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to Gofile.io
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])")
          for FILE in dist/*.deb dist/*.rpm; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/contents/uploadfile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','FAILED'))" 2>/dev/null)
            echo " $FILENAME → $LINK"
          done

  build-linux-arm64:
    name: Build Linux ARM64
    needs: resolve-version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04-arm
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: arm64
      VSCODE_QUALITY: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libx11-dev libxkbfile-dev libsecret-1-dev \
            libkrb5-dev fakeroot python3-pip \
            pkg-config libgtk-3-dev libnss3-dev libgbm-dev libasound2-dev \
            rpm

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: linux-arm64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: linux-arm64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: linux-arm64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-arm64-electron-

      - name: Install dependencies
        run: npm install
        env:
          npm_config_arch: arm64

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile build (produces out-build/)
        run: npm run gulp compile-build-without-mangling
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, arm64)
        working-directory: cli
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Bundle VSCode (produces out-vscode/)
        run: npm run gulp bundle-vscode
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Verify out-vscode exists
        run: |
          if [ ! -d "out-vscode" ]; then
            echo "::error::out-vscode/ not found"
            exit 1
          fi

      - name: Package Electron app (linux arm64)
        run: npm run gulp vscode-linux-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build .deb (arm64)
        run: |
          npm run gulp vscode-linux-arm64-prepare-deb
          npm run gulp vscode-linux-arm64-build-deb
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build .rpm (arm64)
        run: |
          npm run gulp vscode-linux-arm64-prepare-rpm
          npm run gulp vscode-linux-arm64-build-rpm
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find .build/linux/deb -name "*.deb" -exec cp {} dist/ \;
          find .build/linux/rpm -name "*.rpm" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload — deb arm64
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-${{ env.VERSION }}-arm64-deb
          path: dist/*.deb
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — rpm arm64
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-${{ env.VERSION }}-aarch64-rpm
          path: dist/*.rpm
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to Gofile.io
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])")
          for FILE in dist/*.deb dist/*.rpm; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/contents/uploadfile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','FAILED'))" 2>/dev/null)
            echo " $FILENAME → $LINK"
          done
