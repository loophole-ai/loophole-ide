              npm run gulp vscode-reh-web-alpine-arm64-ci

              mkdir -p /workspace/dist
              tar -czf \"/workspace/dist/loophole-reh-alpine-arm64-\${VERSION}.tar.gz\" -C / vscode-reh-alpine-arm64
              tar -czf \"/workspace/dist/loophole-reh-web-alpine-arm64-\${VERSION}.tar.gz\" -C / vscode-reh-web-alpine-arm64
            "

      - name: List built artifacts
