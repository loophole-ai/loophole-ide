name: CI Build — Linux

on:
  pull_request:
    branches:
      - code
  workflow_dispatch:
    inputs:
      upload_to_gofile:
        description: 'Upload artifacts to Gofile.io for faster download?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '24.18.0'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Fast PR check — compile only
  # ─────────────────────────────────────────────────────────────────────────────
  pr-check:
    name: PR Compile Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev pkg-config

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Install dependencies
        run: npm install

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

  # ─────────────────────────────────────────────────────────────────────────────
  # Resolve version
  # ─────────────────────────────────────────────────────────────────────────────
  resolve-version:
    name: Resolve Version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./product.json').loopholeVersion ?? require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: Linux x64
  # Produces: Loophole-{version}-x86_64.AppImage
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-x64:
    name: Build Linux x64
    needs: resolve-version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libx11-dev libxkbfile-dev libsecret-1-dev \
            libkrb5-dev fakeroot squashfs-tools zsync file python3-pip \
            pkg-config libgtk-3-dev libnss3-dev libgbm-dev libasound2-dev

      - name: Install appimagetool
        run: |
          curl -sL -o appimagetool.AppImage \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: linux-x64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: linux-x64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: linux-x64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-x64-electron-

      - name: Install dependencies
        run: npm install
        env:
          npm_config_arch: x64

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile build (produces out-build/)
        run: npm run gulp compile-build-without-mangling
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, x64)
        working-directory: cli
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Bundle VSCode (produces out-vscode/)
        run: npm run gulp bundle-vscode
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Verify out-vscode exists
        run: |
          if [ ! -d "out-vscode" ]; then
            echo "::error::out-vscode/ not found"
            exit 1
          fi

      - name: Package Electron app (linux x64)
        run: npm run gulp vscode-linux-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build AppImage (x86_64)
        run: |
          set -e
          APP_DIR=$(find .. -maxdepth 1 -type d -name "*linux-x64" 2>/dev/null | head -1)
          [ -z "$APP_DIR" ] && APP_DIR="../VSCode-linux-x64"
          if [ ! -d "$APP_DIR" ]; then
            echo "::warning::No unpacked app directory found — skipping AppImage"
            exit 0
          fi

          rm -rf .appimage
          mkdir -p .appimage/AppDir/usr/bin
          cp -r "$APP_DIR"/* .appimage/AppDir/usr/bin/

          EXEC_NAME=$(find .appimage/AppDir/usr/bin -maxdepth 1 -type f -executable \
            ! -name "*.so" ! -name "*.so.*" -printf '%f\n' | grep -x -m1 -e "loophole" -e "code" || true)
          [ -z "$EXEC_NAME" ] && EXEC_NAME="loophole"

          ICON_SRC=$(find resources -iname "*.png" 2>/dev/null | head -1)
          if [ -n "$ICON_SRC" ]; then
            cp "$ICON_SRC" .appimage/AppDir/loophole.png
          else
            touch .appimage/AppDir/loophole.png
          fi

          cat > .appimage/AppDir/loophole.desktop << EOF
          [Desktop Entry]
          Name=Loophole
          Exec=usr/bin/$EXEC_NAME %F
          Icon=loophole
          Type=Application
          Categories=Development;
          EOF

          cat > .appimage/AppDir/AppRun << EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\${HERE}/usr/bin/$EXEC_NAME" "\$@"
          EOF
          chmod +x .appimage/AppDir/AppRun

          # Debug: List all files in AppDir to identify architecture conflicts
          echo "=== Debug: Files in .appimage/AppDir ==="
          find .appimage/AppDir -type f -exec file {} \; | head -50
          echo "=== Debug: Directory structure ==="
          find .appimage/AppDir -type f | head -50

          # Clean up any files that might confuse appimagetool architecture detection
          find .appimage/AppDir -name ".dir-locals.el" -delete
          find .appimage/AppDir -name ".git*" -delete
          find .appimage/AppDir -name "*.a" -delete
          find .appimage/AppDir -name "*.o" -delete

          ARCH=x86_64 appimagetool --no-appstream .appimage/AppDir "dist/Loophole-$VERSION-x86_64.AppImage"

      - name: List built artifacts
        run: ls -lh dist/ || echo "(dist/ is empty)"

      - name: Upload — AppImage x86_64
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-${{ env.VERSION }}-x86_64-appimage
          path: dist/Loophole-${{ env.VERSION }}-x86_64.AppImage
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to Gofile.io
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])")
          for FILE in dist/*.AppImage; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/contents/uploadfile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','FAILED'))" 2>/dev/null)
            echo " $FILENAME → $LINK"
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: Linux arm64
  # Produces: Loophole-{version}-aarch64.AppImage
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Build Linux ARM64
    needs: resolve-version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04-arm
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: arm64
      VSCODE_QUALITY: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libx11-dev libxkbfile-dev libsecret-1-dev \
            libkrb5-dev fakeroot squashfs-tools file python3-pip \
            pkg-config libgtk-3-dev libnss3-dev libgbm-dev libasound2-dev

      - name: Install appimagetool (aarch64)
        run: |
          curl -sL -o appimagetool.AppImage \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage"
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: linux-arm64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: linux-arm64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: linux-arm64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-arm64-electron-

      - name: Install dependencies
        run: npm install
        env:
          npm_config_arch: arm64

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile build (produces out-build/)
        run: npm run gulp compile-build-without-mangling
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, arm64)
        working-directory: cli
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Bundle VSCode (produces out-vscode/)
        run: npm run gulp bundle-vscode
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Verify out-vscode exists
        run: |
          if [ ! -d "out-vscode" ]; then
            echo "::error::out-vscode/ not found"
            exit 1
          fi

      - name: Package Electron app (linux arm64)
        run: npm run gulp vscode-linux-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build AppImage (aarch64)
        run: |
          set -e
          APP_DIR=$(find .. -maxdepth 1 -type d -name "*linux-arm64" 2>/dev/null | head -1)
          [ -z "$APP_DIR" ] && APP_DIR="../VSCode-linux-arm64"
          if [ ! -d "$APP_DIR" ]; then
            echo "::warning::No unpacked app directory found — skipping AppImage"
            exit 0
          fi

          rm -rf .appimage
          mkdir -p .appimage/AppDir/usr/bin
          cp -r "$APP_DIR"/* .appimage/AppDir/usr/bin/

          EXEC_NAME=$(find .appimage/AppDir/usr/bin -maxdepth 1 -type f -executable \
            ! -name "*.so" ! -name "*.so.*" -printf '%f\n' | grep -x -m1 -e "loophole" -e "code" || true)
          [ -z "$EXEC_NAME" ] && EXEC_NAME="loophole"

          ICON_SRC=$(find resources -iname "*.png" 2>/dev/null | head -1)
          if [ -n "$ICON_SRC" ]; then
            cp "$ICON_SRC" .appimage/AppDir/loophole.png
          else
            touch .appimage/AppDir/loophole.png
          fi

          cat > .appimage/AppDir/loophole.desktop << EOF
          [Desktop Entry]
          Name=Loophole
          Exec=usr/bin/$EXEC_NAME %F
          Icon=loophole
          Type=Application
          Categories=Development;
          EOF

          cat > .appimage/AppDir/AppRun << EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\${HERE}/usr/bin/$EXEC_NAME" "\$@"
          EOF
          chmod +x .appimage/AppDir/AppRun

          # Clean up any files that might confuse appimagetool architecture detection
          find .appimage/AppDir -name ".dir-locals.el" -delete
          find .appimage/AppDir -name ".git*" -delete
          find .appimage/AppDir -name "*.a" -delete
          find .appimage/AppDir -name "*.o" -delete

          # Set architecture explicitly and build AppImage
          export ARCH=aarch64
          appimagetool --no-appstream .appimage/AppDir "dist/Loophole-$VERSION-aarch64.AppImage"

      - name: List built artifacts
        run: ls -lh dist/ || echo "(dist/ is empty)"

      - name: Upload — AppImage aarch64
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-${{ env.VERSION }}-aarch64-appimage
          path: dist/Loophole-${{ env.VERSION }}-aarch64.AppImage
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to Gofile.io
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])")
          for FILE in dist/*.AppImage; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/contents/uploadfile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','FAILED'))" 2>/dev/null)
            echo " $FILENAME → $LINK"
          done
