              RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/contents/uploadfile")
              echo "Response: $RESPONSE"
              LINK=$(echo "$RESPONSE" | python3 -c "import sys, json
          try:
              data = json.load(sys.stdin)
              print(data['data']['downloadPage'])
          except (json.JSONDecodeError, KeyError):
              print('UPLOAD_FAILED')")
              if [ "$LINK" = "UPLOAD_FAILED" ]; then
                echo "::warning::Gofile upload failed for $FILENAME — response: $RESPONSE"
              else
                echo " $FILENAME → $LINK"
              fi
            fi
          done
