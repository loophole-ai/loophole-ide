          Write-Host "npm:  $(npm -v)"
          if ([version](npm -v) -ge [version]'11.2.0') {
            Write-Error "npm is still >= 11.2.0 after pin"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-arm64-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-arm64-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-arm64-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-arm64-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-arm64-

      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: npm install
        env:
          npm_config_arch: arm64

      - name: Install open-remote-ssh dependencies
        run: npm install
        working-directory: extensions/open-remote-ssh

      - name: Rebuild native modules for Electron
        run: |
          npm install -g @electron/rebuild
          electron-rebuild -f -w node-pty --arch=arm64
        env:
