      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: publish-linux-arm64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: publish-linux-arm64-cargo-

      - uses: actions/cache@v4
