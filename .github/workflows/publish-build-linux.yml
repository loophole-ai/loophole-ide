name: Publish Build — Linux

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_id:
        required: true
        type: string
  workflow_dispatch:

env:
  NODE_VERSION: '24.18.0'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./product.json').loopholeVersion ?? require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build-linux-x64:
    name: Build Linux x64
    needs: resolve-version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libx11-dev libxkbfile-dev libsecret-1-dev \
            libkrb5-dev fakeroot python3-pip \
            pkg-config libgtk-3-dev libnss3-dev libgbm-dev libasound2-dev \
            rpm

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: linux-x64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: linux-x64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: linux-x64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-x64-electron-

      - name: Install dependencies
        run: npm install
        env:
          npm_config_arch: x64

      - name: Rebuild native modules for Electron (x64)
        run: |
          npm install -g @electron/rebuild
          electron-rebuild -f -w node-pty
        env:
          npm_config_arch: x64

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile build (produces out-build/)
        run: npm run gulp compile-build-without-mangling
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, x64)
        working-directory: cli
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Bundle VSCode (produces out-vscode/)
        run: npm run gulp bundle-vscode
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Verify out-vscode exists
        run: |
          if [ ! -d "out-vscode" ]; then
            echo "::error::out-vscode/ not found"
            exit 1
          fi

      - name: Package Electron app (linux x64)
        run: npm run gulp vscode-linux-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Copy tunnel binary (x64)
        run: |
          cp cli/target/x86_64-unknown-linux-gnu/release/code ../VSCode-linux-x64/bin/loophole-tunnel

      - name: Build .deb (x64)
        run: |
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build .rpm (x64)
        run: |
          npm run gulp vscode-linux-x64-prepare-rpm
          npm run gulp vscode-linux-x64-build-rpm
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find .build/linux/deb -name "*.deb" -exec cp {} dist/ \;
          find .build/linux/rpm -name "*.rpm" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Compute SHA256 hashes
        run: |
          echo "{}" > sha256-hashes.json
          for f in dist/*; do
            [ -f "$f" ] || continue
            FILENAME=$(basename "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            python3 -c "import json,sys; d=json.load(open('sha256-hashes.json')); d[sys.argv[1]]=sys.argv[2]; json.dump(d,open('sha256-hashes.json','w'),indent=2)" "$FILENAME" "$SHA"
          done

      - name: Upload SHA256 hashes artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256-hashes-linux-x64
          path: sha256-hashes.json
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-${{ env.VERSION }}-x64-linux-packages
          path: dist/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*; do
            [ -f "$f" ] && gh release upload "$VERSION" "$f" --clobber
          done

      - name: Upload to Gofile.io
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          [ -z "$SERVER" ] && { echo "[]" > gofile-links-x64.json; exit 0; }
          echo "[" > gofile-links-x64.json; FIRST=true
          for FILE in dist/*; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/contents/uploadfile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','N/A'))" 2>/dev/null)
            [ "$LINK" = "N/A" ] && continue
            [ "$FIRST" = true ] && FIRST=false || echo "," >> gofile-links-x64.json
            echo "  {\"filename\": \"$FILENAME\", \"link\": \"$LINK\", \"platform\": \"linux-x64\"}" >> gofile-links-x64.json
          done
          echo "]" >> gofile-links-x64.json

      - name: Upload Gofile links artifact
        uses: actions/upload-artifact@v4
        with:
          name: gofile-links-linux-x64
          path: gofile-links-x64.json
          retention-days: 7

  build-linux-arm64:
    name: Build Linux ARM64
    needs: resolve-version
    runs-on: ubuntu-22.04-arm
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: arm64
      VSCODE_QUALITY: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
