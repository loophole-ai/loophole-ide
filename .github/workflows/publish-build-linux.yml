name: Publish Build — Linux

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_id:
        required: true
        type: string
  workflow_dispatch:

env:
  NODE_VERSION: '24.18.0'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./product.json').loopholeVersion ?? require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux x64
  # Produces: Loophole-{version}-x86_64.AppImage
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-upload-linux-x64:
    name: Build & Upload Linux x64
    needs: resolve-version
    runs-on: ubuntu-22.04
    environment: publish
    env:
      VERSION: ${{ inputs.version || needs.resolve-version.outputs.version }}
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libx11-dev libxkbfile-dev libsecret-1-dev \
            libkrb5-dev fakeroot squashfs-tools zsync file python3-pip \
            pkg-config libgtk-3-dev libnss3-dev libgbm-dev libasound2-dev

      - name: Install appimagetool
        run: |
          curl -sL -o appimagetool.AppImage \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: publish-linux-x64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: publish-linux-x64-cargo-

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: publish-linux-x64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: publish-linux-x64-electron-

      - name: Install dependencies
        run: npm install
        env:
          npm_config_arch: x64

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile build
        run: npm run gulp compile-build-without-mangling
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (x64)
        working-directory: cli
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Bundle VSCode
        run: npm run gulp bundle-vscode
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Verify out-vscode exists
        run: |
          [ -d "out-vscode" ] || { echo "::error::out-vscode/ not found"; exit 1; }

      - name: Package Electron app (linux x64)
        run: npm run gulp vscode-linux-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build AppImage (x86_64)
        run: |
          set -e
          APP_DIR=$(find .. -maxdepth 1 -type d -name "*linux-x64" 2>/dev/null | head -1)
          [ -z "$APP_DIR" ] && APP_DIR="../VSCode-linux-x64"
          if [ ! -d "$APP_DIR" ]; then
            echo "::warning::No unpacked app directory found — skipping AppImage"
            exit 0
          fi

          mkdir -p .appimage/AppDir/usr/bin
          cp -r "$APP_DIR"/* .appimage/AppDir/usr/bin/

          EXEC_NAME=$(find .appimage/AppDir/usr/bin -maxdepth 1 -type f -executable \
            ! -name "*.so" ! -name "*.so.*" -printf '%f\n' | grep -x -m1 -e "loophole" -e "code" || true)
          [ -z "$EXEC_NAME" ] && EXEC_NAME="loophole"

          ICON_SRC=$(find resources -iname "*.png" 2>/dev/null | head -1)
          [ -n "$ICON_SRC" ] && cp "$ICON_SRC" .appimage/AppDir/loophole.png || touch .appimage/AppDir/loophole.png

          cat > .appimage/AppDir/loophole.desktop << EOF
          [Desktop Entry]
          Name=Loophole
          Exec=usr/bin/$EXEC_NAME %F
          Icon=loophole
          Type=Application
          Categories=Development;
          EOF

          cat > .appimage/AppDir/AppRun << EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\${HERE}/usr/bin/$EXEC_NAME" "\$@"
          EOF
          chmod +x .appimage/AppDir/AppRun

          ARCH=x86_64 appimagetool .appimage/AppDir "dist/Loophole-$VERSION-x86_64.AppImage"

      - name: Compute SHA256
        run: |
          echo "{}" > sha256-hashes.json
          for f in dist/*; do
            [ -f "$f" ] || continue
            FILENAME=$(basename "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            python3 -c "import json,sys; d=json.load(open('sha256-hashes.json')); d[sys.argv[1]]=sys.argv[2]; json.dump(d,open('sha256-hashes.json','w'),indent=2)" "$FILENAME" "$SHA"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sha256-hashes-linux-x64
          path: sha256-hashes.json
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Loophole-${{ env.VERSION }}-x86_64-appimage
          path: dist/Loophole-${{ env.VERSION }}-x86_64.AppImage
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*; do
            [ -f "$f" ] && gh release upload "$VERSION" "$f" --clobber
          done

      - name: Upload to Gofile.io
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          [ -z "$SERVER" ] && { echo "[]" > gofile-links-x64.json; exit 0; }
          echo "[" > gofile-links-x64.json; FIRST=true
          for FILE in dist/*; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/contents/uploadfile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','N/A'))" 2>/dev/null)
            [ "$LINK" = "N/A" ] && continue
            [ "$FIRST" = true ] && FIRST=false || echo "," >> gofile-links-x64.json
            echo "  {\"filename\": \"$FILENAME\", \"link\": \"$LINK\", \"platform\": \"linux-x64\"}" >> gofile-links-x64.json
          done
          echo "]" >> gofile-links-x64.json

      - uses: actions/upload-artifact@v4
        with:
          name: gofile-links-linux-x64
          path: gofile-links-x64.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux arm64
  # Produces: Loophole-{version}-aarch64.AppImage
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-upload-linux-arm64:
    name: Build & Upload Linux ARM64
    needs: resolve-version
    runs-on: ubuntu-22.04-arm
    environment: publish
    env:
