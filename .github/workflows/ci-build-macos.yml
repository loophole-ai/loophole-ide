          else
            echo "::warning::CLI binary not found — skipping"
          fi

      # ── Summary & upload ────────────────────────────────────────────────────────[...]
      - name: List built artifacts
        run: |
          echo "=== dist/ artifacts ==="
          ls -lh dist/ || echo "(dist/ is empty)"

      - name: Upload — DMG
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-darwin-arm64-${{ env.VERSION }}-dmg
          path: dist/Loophole.arm64.${{ env.VERSION }}.dmg
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-darwin-arm64-${{ env.VERSION }}-zip
          path: dist/Loophole-darwin-arm64-${{ env.VERSION }}.zip
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — Remote Host
        uses: actions/upload-artifact@v4
        with:
          name: loophole-reh-darwin-arm64-${{ env.VERSION }}
          path: dist/loophole-reh-darwin-arm64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — Web Host
        uses: actions/upload-artifact@v4
        with:
          name: loophole-reh-web-darwin-arm64-${{ env.VERSION }}
          path: dist/loophole-reh-web-darwin-arm64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — CLI
        uses: actions/upload-artifact@v4
        with:
          name: loophole-cli-darwin-arm64-${{ env.VERSION }}
          path: dist/loophole-cli-darwin-arm64-${{ env.VERSION }}.tar.gz
          retention-days: 7
          if-no-files-found: warn

      # ── Upload to Gofile.io (optional) ────────────────────────────────────────
      - name: Upload to Gofile.io
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        shell: bash
        run: |
          echo "======================================"
          echo "  Uploading artifacts to Gofile.io"
          echo "======================================"

          # Get best available server
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          if [ -z "$SERVER" ]; then
            echo "::warning::Failed to get Gofile.io server — skipping upload"
            exit 0
          fi
          echo "Using server: $SERVER"

          for FILE in dist/*.{dmg,zip,tar.gz}; do
            if [ -f "$FILE" ]; then
              FILENAME=$(basename "$FILE")
              echo ""
              echo "Uploading: $FILENAME"
              RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile")

              # Validate response is valid JSON before parsing
              if ! echo "$RESPONSE" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
                echo "::warning::Invalid response from Gofile.io for $FILENAME: $RESPONSE"
                continue
              fi

              LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data', {}).get('downloadPage', 'N/A'))" 2>/dev/null)
              if [ -n "$LINK" ] && [ "$LINK" != "N/A" ]; then
                echo " $FILENAME → $LINK"
              else
                echo "::warning::Could not extract download link for $FILENAME"
              fi
            fi
          done
