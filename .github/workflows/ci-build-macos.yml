name: CI Build — macOS

on:
  pull_request:
    branches:
      - code
  workflow_dispatch:
    inputs:
      upload_to_gofile:
        description: 'Upload artifacts to Gofile.io for faster download?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '24.18.0'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Fast PR check — compile only
  # ─────────────────────────────────────────────────────────────────────────────
  pr-check:
    name: PR Compile Check
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

  # ─────────────────────────────────────────────────────────────────────────────
  # Resolve version
  # ─────────────────────────────────────────────────────────────────────────────
  resolve-version:
    name: Resolve Version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./product.json').loopholeVersion ?? require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: macOS x64 (Intel)
  # Produces: Loophole-darwin-x64-{version}.dmg
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-x64:
    name: Build macOS x64 (Intel)
    needs: resolve-version
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: macos-x64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: macos-x64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: macos-x64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: macos-x64-electron-

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile build (produces out-build/)
        run: npm run gulp compile-build-without-mangling
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Bundle VSCode (produces out-vscode/)
        run: npm run gulp bundle-vscode
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Verify out-vscode exists
        run: |
          if [ ! -d "out-vscode" ]; then
            echo "::error::out-vscode/ not found"
            exit 1
          fi

      - name: Build CLI (Rust, x64)
        working-directory: cli
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package Electron app (darwin x64)
        run: npm run gulp vscode-darwin-x64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Ad-hoc codesign .app bundle
        run: |
          APP_PATH=$(find .. -maxdepth 2 -name "*.app" -type d 2>/dev/null | grep -i "darwin-x64" | head -1)
          [ -z "$APP_PATH" ] && APP_PATH="../VSCode-darwin-x64/loophole.app"
          if [ -d "$APP_PATH" ]; then
            codesign --deep --force --sign - "$APP_PATH" || echo "::warning::Ad-hoc codesign failed"
          else
            echo "::warning::No .app bundle found — skipping codesign"
          fi

      - name: Build DMG
        run: |
          set -e
          APP_PATH=$(find .. -maxdepth 2 -name "*.app" -type d 2>/dev/null | grep -i "darwin-x64" | head -1)
          [ -z "$APP_PATH" ] && APP_PATH="../VSCode-darwin-x64/Visual Studio Code.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app bundle found — cannot build DMG"
            exit 1
          fi
          hdiutil create -volname "Loophole" -srcfolder "$APP_PATH" -ov -format UDZO \
            "dist/Loophole-darwin-x64-$VERSION.dmg"

      - name: Upload — DMG
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-darwin-x64-${{ env.VERSION }}-dmg
          path: dist/Loophole-darwin-x64-${{ env.VERSION }}.dmg
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to Gofile.io
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          for FILE in dist/*.dmg; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','FAILED'))" 2>/dev/null)
            echo " $FILENAME → $LINK"
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: macOS arm64 (Apple Silicon)
  # Produces: Loophole-darwin-arm64-{version}.dmg
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-arm64:
    name: Build macOS ARM64 (Apple Silicon)
    needs: resolve-version
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      VSCODE_ARCH: arm64
      VSCODE_QUALITY: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        run: |
          npm install -g npm@11.1.0
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: macos-arm64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: macos-arm64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: macos-arm64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: macos-arm64-electron-

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: arm64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React UI
        run: npm run buildreact
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Compile build (produces out-build/)
        run: npm run gulp compile-build-without-mangling
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Bundle VSCode (produces out-vscode/)
        run: npm run gulp bundle-vscode
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Verify out-vscode exists
        run: |
          if [ ! -d "out-vscode" ]; then
            echo "::error::out-vscode/ not found"
            exit 1
          fi

      - name: Build CLI (Rust, arm64)
        working-directory: cli
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package Electron app (darwin arm64)
        run: npm run gulp vscode-darwin-arm64-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Ad-hoc codesign .app bundle
        run: |
          APP_PATH=$(find .. -maxdepth 2 -name "*.app" -type d 2>/dev/null | grep -i "darwin-arm64" | head -1)
          [ -z "$APP_PATH" ] && APP_PATH="../VSCode-darwin-arm64/Visual Studio Code.app"
          if [ -d "$APP_PATH" ]; then
            codesign --deep --force --sign - "$APP_PATH" || echo "::warning::Ad-hoc codesign failed"
          else
            echo "::warning::No .app bundle found — skipping codesign"
          fi

      - name: Build DMG
        run: |
          set -e
          APP_PATH=$(find .. -maxdepth 2 -name "*.app" -type d 2>/dev/null | grep -i "darwin-arm64" | head -1)
          [ -z "$APP_PATH" ] && APP_PATH="../VSCode-darwin-arm64/Visual Studio Code.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app bundle found — cannot build DMG"
            exit 1
          fi
          hdiutil create -volname "Loophole" -srcfolder "$APP_PATH" -ov -format UDZO \
            "dist/Loophole-darwin-arm64-$VERSION.dmg"

      # Save the arm64 .app for the universal job
      - name: Upload — arm64 .app bundle (for universal build)
        uses: actions/upload-artifact@v4
        with:
          name: loophole-darwin-arm64-app-${{ env.VERSION }}
          path: ../*darwin-arm64/*.app
          retention-days: 1
          if-no-files-found: warn

      - name: Upload — DMG
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-darwin-arm64-${{ env.VERSION }}-dmg
          path: dist/Loophole-darwin-arm64-${{ env.VERSION }}.dmg
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to Gofile.io
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          for FILE in dist/*.dmg; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','FAILED'))" 2>/dev/null)
            echo " $FILENAME → $LINK"
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: macOS Universal
  # Merges x64 + arm64 .app with lipo → Loophole-darwin-universal-{version}.dmg
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-universal:
    name: Build macOS Universal
    needs: [resolve-version, build-macos-x64, build-macos-arm64]
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x64 DMG
        uses: actions/download-artifact@v4
        with:
          name: Loophole-darwin-x64-${{ env.VERSION }}-dmg
          path: downloads/x64

      - name: Download arm64 DMG
        uses: actions/download-artifact@v4
        with:
          name: Loophole-darwin-arm64-${{ env.VERSION }}-dmg
          path: downloads/arm64

      - name: Extract both .app bundles from DMGs
        run: |
          set -e
          mkdir -p mount/x64 mount/arm64 apps/x64 apps/arm64

          hdiutil attach "downloads/x64/Loophole-darwin-x64-$VERSION.dmg" -mountpoint mount/x64 -readonly -nobrowse
          cp -R mount/x64/*.app apps/x64/
          hdiutil detach mount/x64

          hdiutil attach "downloads/arm64/Loophole-darwin-arm64-$VERSION.dmg" -mountpoint mount/arm64 -readonly -nobrowse
          cp -R mount/arm64/*.app apps/arm64/
          hdiutil detach mount/arm64

          echo "x64 app: $(ls apps/x64/)"
          echo "arm64 app: $(ls apps/arm64/)"

      - name: Create Universal .app with lipo
        run: |
          set -e
          X64_APP=$(find apps/x64 -name "*.app" -maxdepth 1 | head -1)
          ARM64_APP=$(find apps/arm64 -name "*.app" -maxdepth 1 | head -1)
          APP_NAME=$(basename "$X64_APP")
          UNIVERSAL_APP="apps/universal/$APP_NAME"

          echo "Merging: $X64_APP + $ARM64_APP → $UNIVERSAL_APP"
          mkdir -p apps/universal

          # Copy x64 as the base
          cp -R "$X64_APP" "$UNIVERSAL_APP"

          # lipo-merge every binary that differs between the two
          find "$X64_APP" -type f | while read -r X64_BIN; do
            REL="${X64_BIN#$X64_APP/}"
            ARM64_BIN="$ARM64_APP/$REL"
            UNIV_BIN="$UNIVERSAL_APP/$REL"

            if [ -f "$ARM64_BIN" ] && file "$X64_BIN" | grep -q "Mach-O"; then
              lipo -create "$X64_BIN" "$ARM64_BIN" -output "$UNIV_BIN" 2>/dev/null || \
                cp "$ARM64_BIN" "$UNIV_BIN"
            fi
          done

          echo "Universal app created"
          file "$UNIVERSAL_APP/Contents/MacOS/"* || true

      - name: Ad-hoc codesign universal .app
        run: |
          UNIVERSAL_APP=$(find apps/universal -name "*.app" -maxdepth 1 | head -1)
          codesign --deep --force --sign - "$UNIVERSAL_APP" || echo "::warning::codesign failed"

      - name: Build Universal DMG
        run: |
          set -e
          mkdir -p dist
          UNIVERSAL_APP=$(find apps/universal -name "*.app" -maxdepth 1 | head -1)
          hdiutil create -volname "Loophole" -srcfolder "$UNIVERSAL_APP" -ov -format UDZO \
            "dist/Loophole-darwin-universal-$VERSION.dmg"

      - name: Upload — Universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: Loophole-darwin-universal-${{ env.VERSION }}-dmg
          path: dist/Loophole-darwin-universal-${{ env.VERSION }}.dmg
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to Gofile.io
        if: ${{ github.event.inputs.upload_to_gofile == 'true' }}
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          for FILE in dist/*.dmg; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','FAILED'))" 2>/dev/null)
            echo " $FILENAME → $LINK"
          done
