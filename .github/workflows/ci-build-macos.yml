      # ── 5. CLI tarball ───────────────────────────────────────────────────────[...]
      - name: Stage — CLI tarball
        run: |
          cli_bin="cli/target/aarch64-apple-darwin/release/loophole"
          if [ -f "$cli_bin" ]; then
            mkdir -p .tmp-cli
