name: Publish Build — Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_id:
        required: true
        type: string
  workflow_dispatch:

env:
  NODE_VERSION: '24.18.0'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Resolve version
  # ─────────────────────────────────────────────────────────────────────────────
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./product.json').loopholeVersion ?? require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: Windows x64
  # Produces: LoopholeUserSetup-x64-{version}.exe, LoopholeSetup-x64-{version}.exe
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows-x64:
    name: Build Windows x64
    needs: resolve-version
    runs-on: windows-2022
    environment: publish
    env:
      VERSION: ${{ inputs.version || needs.resolve-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        shell: pwsh
        run: |
          npm install -g npm@11.1.0
          Write-Host "node: $(node -v)"
          Write-Host "npm:  $(npm -v)"
          if ([version](npm -v) -ge [version]'11.2.0') {
            Write-Error "npm is still >= 11.2.0 after pin"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: publish-win-x64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: publish-win-x64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: publish-win-x64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: publish-win-x64-electron-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: publish-win-x64-node-${{ hashFiles('package-lock.json') }}
          restore-keys: publish-win-x64-node-

      - name: Clear stale postinstall state marker
        shell: pwsh
        run: |
          Remove-Item -Path "node_modules/.postinstall-state","node_modules/.postinstall-state-contents" -ErrorAction SilentlyContinue

      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: npm install
        env:
          npm_config_arch: x64

      - name: Install open-remote-ssh dependencies
        run: npm install
        working-directory: extensions/open-remote-ssh

      - name: Rebuild native modules for Electron
        run: |
          npm install -g @electron/rebuild
          electron-rebuild -f -w node-pty,onnxruntime-node
        env:
          npm_config_arch: x64

      - name: Restore conpty binaries from node-pty prebuilds
        shell: pwsh
        run: |
          $src  = "node_modules/node-pty/prebuilds/win32-x64/conpty"
          $dest = "node_modules/node-pty/build/Release/conpty"
          if (-not (Test-Path $src)) {
            Write-Error "Cannot find node-pty prebuilds at '$src'."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$src/*" -Destination $dest -Recurse -Force
          Write-Host "Copied conpty binaries from $src to $dest"
          Get-ChildItem $dest

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React components
        run: node build.js
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, x64)
        working-directory: cli
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Electron app
        run: npm run gulp vscode-win32-x64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Copy Inno Updater tools
        run: npm run gulp vscode-win32-x64-inno-updater

      - name: Build User Installer
        run: npm run gulp vscode-win32-x64-user-setup
        env:
          VSCODE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — User Installer
        shell: pwsh
        run: |
          if (Test-Path ".build/win32-x64/user-setup") {
            $src = Get-ChildItem ".build/win32-x64/user-setup" -Filter "*.exe" | Select-Object -First 1
            if ($src) {
              Copy-Item $src.FullName "dist/LoopholeUserSetup-x64-$env:VERSION.exe"
              Write-Host "Staged: $($src.Name)"
            } else { Write-Warning "No .exe found in user-setup — skipping" }
          } else { Write-Warning "user-setup folder not found — skipping" }

      - name: Build System Installer
        run: npm run gulp vscode-win32-x64-system-setup
        env:
          VSCODE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — System Installer
        shell: pwsh
        run: |
          if (Test-Path ".build/win32-x64/system-setup") {
            $src = Get-ChildItem ".build/win32-x64/system-setup" -Filter "*.exe" | Select-Object -First 1
            if ($src) {
              Copy-Item $src.FullName "dist/LoopholeSetup-x64-$env:VERSION.exe"
              Write-Host "Staged: $($src.Name)"
            } else { Write-Warning "No .exe found in system-setup — skipping" }
          } else { Write-Warning "system-setup folder not found — skipping" }

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "`n=== dist/ artifacts ==="
          Get-ChildItem dist | ForEach-Object {
            $size = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name)  ($size MB)"
          }

      - name: Compute SHA256 hashes
        shell: pwsh
        run: |
          $hashes = @{}
          Get-ChildItem dist | Where-Object { !$_.PSIsContainer } | ForEach-Object {
            $sha = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $hashes[$_.Name] = $sha
            Write-Host "$($_.Name) → $sha"
          }
          $hashes | ConvertTo-Json | Set-Content sha256-hashes.json

      - name: Upload SHA256 hashes artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256-hashes-windows-x64
          path: sha256-hashes.json
          retention-days: 7

      - name: Upload — User Installer
        uses: actions/upload-artifact@v4
        with:
          name: LoopholeUserSetup-x64-${{ env.VERSION }}
          path: dist/LoopholeUserSetup-x64-${{ env.VERSION }}.exe
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — System Installer
        uses: actions/upload-artifact@v4
        with:
          name: LoopholeSetup-x64-${{ env.VERSION }}
          path: dist/LoopholeSetup-x64-${{ env.VERSION }}.exe
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist
          foreach ($f in $files) {
            Write-Host "Uploading $($f.Name)..."
            gh release upload "$env:VERSION" "$($f.FullName)" --clobber
          }

      - name: Update versions repository (x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the user installer (preferred for updates)
          $userInstaller = Get-ChildItem dist -Filter "LoopholeUserSetup-x64-$env:VERSION.exe" | Select-Object -First 1
          if ($userInstaller) {
            # Compute SHA256
            $sha256 = (Get-FileHash -Algorithm SHA256 $userInstaller.FullName).Hash.ToLower()

            # Create latest.json
            $latestJson = @{
              version = $env:VERSION
              productVersion = $env:VERSION
              url = "https://github.com/loophole-ai/loophole-ide/releases/download/$env:VERSION/LoopholeUserSetup-x64-$env:VERSION.exe"
              sha256hash = $sha256
              timestamp = [long][double]::Parse((Get-Date -UFormat %s)) * 1000
            } | ConvertTo-Json -Depth 10

            # Clone versions repo with authentication
            git clone https://x-access-token:${env:GH_TOKEN}@github.com/loophole-ai/versions.git versions-repo
            cd versions-repo

            # Ensure directory exists
            New-Item -ItemType Directory -Force -Path "oss/win32/x64"

            # Write latest.json
            $latestJson | Out-File -FilePath "oss/win32/x64/latest.json" -Encoding utf8

            # Commit and push
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add oss/win32/x64/latest.json
            git commit -m "Update Windows x64 to $env:VERSION"
            git push
          } else {
            Write-Warning "User installer not found, skipping versions repo update"
          }

      - name: Upload to Gofile.io
        shell: bash
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          [ -z "$SERVER" ] && { echo "::warning::Could not get Gofile server"; exit 0; }
          echo "[" > gofile-links-x64.json
          FIRST=true
          for FILE in dist/*.exe; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/contents/uploadfile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','N/A'))" 2>/dev/null)
            [ "$LINK" = "N/A" ] && continue
            [ "$FIRST" = true ] && FIRST=false || echo "," >> gofile-links-x64.json
            echo "  {\"filename\": \"$FILENAME\", \"link\": \"$LINK\", \"platform\": \"windows-x64\"}" >> gofile-links-x64.json
          done
          echo "]" >> gofile-links-x64.json

      - name: Upload Gofile links artifact
        uses: actions/upload-artifact@v4
        with:
          name: gofile-links-windows-x64
          path: gofile-links-x64.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: Windows arm64
  # Produces: LoopholeUserSetup-arm64-{version}.exe, LoopholeSetup-arm64-{version}.exe
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows-arm64:
    name: Build Windows arm64
    needs: resolve-version
    runs-on: windows-2022
    environment: publish
    env:
      VERSION: ${{ inputs.version || needs.resolve-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm (< 11.2.0 required by preinstall)
        shell: pwsh
        run: |
          npm install -g npm@11.1.0
          Write-Host "node: $(node -v)"
          Write-Host "npm:  $(npm -v)"
          if ([version](npm -v) -ge [version]'11.2.0') {
            Write-Error "npm is still >= 11.2.0 after pin"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Rust (for CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: publish-win-arm64-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: publish-win-arm64-cargo-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: publish-win-arm64-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: publish-win-arm64-electron-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: publish-win-arm64-node-${{ hashFiles('package-lock.json') }}
          restore-keys: publish-win-arm64-node-

      - name: Clear stale postinstall state marker
        shell: pwsh
        run: |
          Remove-Item -Path "node_modules/.postinstall-state","node_modules/.postinstall-state-contents" -ErrorAction SilentlyContinue

      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: npm install
        env:
          npm_config_arch: arm64

      - name: Install open-remote-ssh dependencies
        run: npm install
        working-directory: extensions/open-remote-ssh

      - name: Rebuild native modules for Electron
        run: |
          npm install -g @electron/rebuild
          electron-rebuild -f -w node-pty,onnxruntime-node --arch=arm64
        env:
          npm_config_arch: arm64

      - name: Restore conpty binaries from node-pty prebuilds
        shell: pwsh
        run: |
          $src  = "node_modules/node-pty/prebuilds/win32-arm64/conpty"
          $dest = "node_modules/node-pty/build/Release/conpty"
          if (-not (Test-Path $src)) {
            Write-Error "Cannot find node-pty prebuilds at '$src'."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$src/*" -Destination $dest -Recurse -Force
          Write-Host "Copied conpty binaries from $src to $dest"
          Get-ChildItem $dest

      - name: Install React dependencies
        run: npm install
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Build React components
        run: node build.js
        working-directory: src/vs/workbench/contrib/void/browser/react

      - name: Compile TypeScript
        run: npm run compile
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build CLI (Rust, arm64)
        working-directory: cli
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Package Electron app
        run: npm run gulp vscode-win32-arm64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Create dist directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Copy Inno Updater tools
        run: npm run gulp vscode-win32-arm64-inno-updater

      - name: Build User Installer
        run: npm run gulp vscode-win32-arm64-user-setup
        env:
          VSCODE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — User Installer
        shell: pwsh
        run: |
          if (Test-Path ".build/win32-arm64/user-setup") {
            $src = Get-ChildItem ".build/win32-arm64/user-setup" -Filter "*.exe" | Select-Object -First 1
            if ($src) {
              Copy-Item $src.FullName "dist/LoopholeUserSetup-arm64-$env:VERSION.exe"
              Write-Host "Staged: $($src.Name)"
            } else { Write-Warning "No .exe found in user-setup — skipping" }
          } else { Write-Warning "user-setup folder not found — skipping" }

      - name: Build System Installer
        run: npm run gulp vscode-win32-arm64-system-setup
        env:
          VSCODE_QUALITY: stable
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Stage — System Installer
        shell: pwsh
        run: |
          if (Test-Path ".build/win32-arm64/system-setup") {
            $src = Get-ChildItem ".build/win32-arm64/system-setup" -Filter "*.exe" | Select-Object -First 1
            if ($src) {
              Copy-Item $src.FullName "dist/LoopholeSetup-arm64-$env:VERSION.exe"
              Write-Host "Staged: $($src.Name)"
            } else { Write-Warning "No .exe found in system-setup — skipping" }
          } else { Write-Warning "system-setup folder not found — skipping" }

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "`n=== dist/ artifacts ==="
          Get-ChildItem dist | ForEach-Object {
            $size = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name)  ($size MB)"
          }

      - name: Compute SHA256 hashes
        shell: pwsh
        run: |
          $hashes = @{}
          Get-ChildItem dist | Where-Object { !$_.PSIsContainer } | ForEach-Object {
            $sha = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $hashes[$_.Name] = $sha
            Write-Host "$($_.Name) → $sha"
          }
          $hashes | ConvertTo-Json | Set-Content sha256-hashes.json

      - name: Upload SHA256 hashes artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256-hashes-windows-arm64
          path: sha256-hashes.json
          retention-days: 7

      - name: Upload — User Installer
        uses: actions/upload-artifact@v4
        with:
          name: LoopholeUserSetup-arm64-${{ env.VERSION }}
          path: dist/LoopholeUserSetup-arm64-${{ env.VERSION }}.exe
          retention-days: 7
          if-no-files-found: warn

      - name: Upload — System Installer
        uses: actions/upload-artifact@v4
        with:
          name: LoopholeSetup-arm64-${{ env.VERSION }}
          path: dist/LoopholeSetup-arm64-${{ env.VERSION }}.exe
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist
          foreach ($f in $files) {
            Write-Host "Uploading $($f.Name)..."
            gh release upload "$env:VERSION" "$($f.FullName)" --clobber
          }

      - name: Update versions repository (arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the user installer (preferred for updates)
          $userInstaller = Get-ChildItem dist -Filter "LoopholeUserSetup-arm64-$env:VERSION.exe" | Select-Object -First 1
          if ($userInstaller) {
            # Compute SHA256
            $sha256 = (Get-FileHash -Algorithm SHA256 $userInstaller.FullName).Hash.ToLower()

            # Create latest.json
            $latestJson = @{
              version = $env:VERSION
              productVersion = $env:VERSION
              url = "https://github.com/loophole-ai/loophole-ide/releases/download/$env:VERSION/LoopholeUserSetup-arm64-$env:VERSION.exe"
              sha256hash = $sha256
              timestamp = [long][double]::Parse((Get-Date -UFormat %s)) * 1000
            } | ConvertTo-Json -Depth 10

            # Clone versions repo with authentication
            git clone https://x-access-token:${env:GH_TOKEN}@github.com/loophole-ai/versions.git versions-repo
            cd versions-repo

            # Ensure directory exists
            New-Item -ItemType Directory -Force -Path "oss/win32/arm64"

            # Write latest.json
            $latestJson | Out-File -FilePath "oss/win32/arm64/latest.json" -Encoding utf8

            # Commit and push
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add oss/win32/arm64/latest.json
            git commit -m "Update Windows arm64 to $env:VERSION"
            git push
          } else {
            Write-Warning "User installer not found, skipping versions repo update"
          }

      - name: Upload to Gofile.io
        shell: bash
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['data']['servers'][0]['name'])" 2>/dev/null)
          [ -z "$SERVER" ] && { echo "::warning::Could not get Gofile server"; exit 0; }
          echo "[" > gofile-links-arm64.json
          FIRST=true
          for FILE in dist/*.exe; do
            [ -f "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            RESPONSE=$(curl -s -F "file=@$FILE" "https://$SERVER.gofile.io/contents/uploadfile")
            LINK=$(echo "$RESPONSE" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('data',{}).get('downloadPage','N/A'))" 2>/dev/null)
            [ "$LINK" = "N/A" ] && continue
            [ "$FIRST" = true ] && FIRST=false || echo "," >> gofile-links-arm64.json
            echo "  {\"filename\": \"$FILENAME\", \"link\": \"$LINK\", \"platform\": \"windows-arm64\"}" >> gofile-links-arm64.json
          done
          echo "]" >> gofile-links-arm64.json

      - name: Upload Gofile links artifact
        uses: actions/upload-artifact@v4
        with:
          name: gofile-links-windows-arm64
          path: gofile-links-arm64.json
          retention-days: 7
